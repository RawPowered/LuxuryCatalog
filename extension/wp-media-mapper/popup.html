<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WP Media Mapper</title>
    <style>
      body { font-family: Arial, sans-serif; width: 360px; margin: 0; padding: 12px; }
      h1 { font-size: 15px; margin: 0 0 8px 0; }
      .row { margin-bottom: 10px; }
      textarea { width: 100%; min-height: 90px; box-sizing: border-box; }
      button { padding: 8px 10px; margin-right: 6px; cursor: pointer; }
      #status { font-size: 12px; color: #444; white-space: pre-wrap; }
      .muted { font-size: 11px; color: #666; }
    </style>
  </head>
  <body>
    <h1>WP Media Mapper</h1>
    <div class="row muted">Run from WordPress Media Library list view (`/wp-admin/upload.php`).</div>
    <div class="row">
      <button id="collectBtn">Collect All Media URLs</button>
      <button id="clearBtn">Clear</button>
    </div>
    <div class="row">
      <label for="doorInput"><strong>Door SKUs / names (optional filter, one per line)</strong></label>
      <textarea id="doorInput" placeholder="LUX-011&#10;LUX-012&#10;..."></textarea>
    </div>
    <div class="row">
      <button id="exportBtn">Export Woo CSV</button>
    </div>
    <div id="status">Idle.</div>
    <script src="popup.js"></script>
  </body>
  </html>
